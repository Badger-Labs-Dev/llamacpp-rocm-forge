name: Deploy viewer to GitHub Pages

# Builds benchmark/generate_viewer_data.py's output + the Vite app in
# viewer/ and publishes it to GitHub Pages. results/ isn't committed (see
# .gitignore) - if it's ever empty here, generate_viewer_data.py still
# writes a valid empty models: [] results.json and the site deploys with
# an empty state rather than failing the build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync

      - name: Ensure results/ exists
        run: mkdir -p results

      - name: Generate viewer data
        run: uv run benchmark/generate_viewer_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer deps
        working-directory: viewer
        run: npm ci

      - name: Build viewer
        working-directory: viewer
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
